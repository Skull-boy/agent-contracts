name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

# Least privilege: reading the repository is the baseline. The publish job
# additionally requests id-token: write because it uses PyPI Trusted
# Publishing (OIDC) rather than a stored API token.
permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest
    environment: pypi

    # Required for PyPI Trusted Publishing (OIDC). The workflow body passes no
    # password/API token to the publish action, so id-token is the only write
    # scope this job needs.
    permissions:
      id-token: write  # MANDATORY for trusted publishing
      contents: read   # Required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest PyYAML jsonschema PyGithub qdrant-client

      - name: Verify Version matches Tag
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Package Version: $PACKAGE_VERSION"
          echo "Tag Version: $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify installed wheel isolation
        run: |
          mkdir -p /tmp/wheel-test
          cd /tmp/wheel-test
          python -c "import scyvera; print(scyvera.__file__)" > import_path.txt
          cat import_path.txt
          if grep -q "site-packages" import_path.txt; then
            echo "Successfully loaded from site-packages"
          else
            echo "Error: Loaded from repository instead of site-packages"
            exit 1
          fi

      - name: Verify CLI executable
        run: |
          cd /tmp/wheel-test
          scyvera --help
          scyvera init test_contract.yaml --name "Release System" --domain "software"
          scyvera validate test_contract.yaml
          scyvera lint test_contract.yaml

      - name: Verify Python API
        run: |
          cd /tmp/wheel-test
          python -c 'from scyvera import Contract; c = Contract(name="Release System").set_domain("software").add_capability("test"); v = c.validate(); assert v.valid is True'

      - name: Run test suite on installed package
        run: |
          cd /tmp/wheel-test
          python -m pytest $GITHUB_WORKSPACE/tests/ -v

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3 (release/v1; pinned 2026-11-06)
        # No API token or password is provided here;
        # Trusted Publishing uses OIDC automatically.
