# Publishing @scyvera/scyvera-ts (human-gated, staged, OIDC-attested).
#
# GE-4b: releases are staged, never published directly. The flow is:
#
#   1. CI authenticates with a GitHub OIDC trusted publisher. There is no
#      long-lived npm token for this repository and no `NPM_TOKEN` secret.
#   2. CI runs `npm stage publish`, which needs no 2FA. The version waits in
#      npm's staging area; it is not installable yet.
#   3. The maintainer reviews it under "Staged Packages" on npmjs.com and
#      approves it with 2FA. Only then does the version become public and the
#      staged tag (default `latest`) take effect.
#
# Required repository settings (both are maintainer-owned):
#   1. Trusted publisher for `@scyvera/scyvera-ts`:
#        GitHub Actions
#        repository  Skull-boy/agent-contracts
#        workflow    publish-scyvera-ts.yml
#        environment npm-production
#        allowed     npm stage publish only (not npm publish)
#      Configure it immediately before a release: a trusted publisher that does
#      not complete a successful publish within 2 days expires unvalidated.
#   2. Environment `npm-production` - must exist and must list the maintainer
#      as a required reviewer.
#
# The environment gate pauses the job before any step runs: the maintainer
# approves "Review approvals -> Approve and deploy". Nothing is staged on
# merge, and approving the job only stages the release - the second, 2FA
# approval on npmjs.com is what publishes it.
#
# Releases for this package are tagged `scyvera-ts-v<version>`. The bare
# `v<version>` namespace belongs to the Python package, so the tag check below
# compares against "scyvera-ts-v${version}".

name: Publish @scyvera/scyvera-ts
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "npm stage publish --dry-run only"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    defaults:
      run:
        working-directory: runtimes/ts
    env:
      PINNED_SUITE_VERSION: "1"
      NPM_CLI_MAJOR: "11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build: a cached node_modules tree
          # is an input to the artifact that gets attested, and npm's
          # trusted-publishing guidance is to never cache release builds.
      - name: Pin npm 11 for staged publishing
        run: |
          npm install -g "npm@${NPM_CLI_MAJOR}"
          version="$(npm --version)"
          major="${version%%.*}"
          if [ "${major}" -lt 11 ]; then
            echo "::error::staged publishing requires npm >= 11.15.0, got ${version}"
            exit 1
          fi
      - run: npm ci
      - name: Verify tag and suite pin
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "scyvera-ts-v${version}"
          suite="$(tr -d '\r' < ../../vectors/suite-version)"
          test "${suite}" = "suite-version: ${PINNED_SUITE_VERSION}"
      - run: npm test
      - run: npm run vectors
      - name: Stage the release (OIDC, no token)
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm stage publish --dry-run --provenance --access public
          else
            npm stage publish --provenance --access public
          fi
