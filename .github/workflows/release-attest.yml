name: Release Attestation

# RFC 0003 §C6 / roadmap M3.3: sign the wheel with Sigstore, emit an SBOM, and
# publish a release manifest binding
# {wheel_hash, schema_version, adapter_floors, self_check_manifest}.
#
# The attested wheel MUST be the exact bytes already on PyPI, so the primary
# path is `workflow_run` after "Publish to PyPI" succeeds: we download that
# run's `dist` artifact and never rebuild. Rebuilding here would attest bytes
# that were not published, which is precisely the substitution this workflow
# exists to prevent.
#
# `workflow_dispatch` is the dry-run path: it builds a wheel from the selected
# ref, runs the same generation, self-check, and attestation steps, and skips
# the GitHub Release upload. That is how the roadmap's "CI run on a test tag
# (dry-run verified in a branch)" acceptance is exercised before a real tag.

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:

# Least privilege baseline. Every job below names its own permissions.
permissions:
  contents: read

jobs:
  attest:
    name: Attest published release
    # workflow_run cannot filter on conclusion in `on:`, so gate the job.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # actions: read        -> download the completed publish run's `dist` artifact
    # contents: write      -> upload assets to the tag's GitHub Release
    # id-token: write      -> Sigstore OIDC signing
    # attestations: write  -> persist the build-provenance attestation
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout the published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # tags are needed to resolve the release tag below

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: "3.12"

      - name: Download the published dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (pinned 2026-11-06)
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the published wheel into an isolated venv
        run: |
          python -m venv /tmp/attest-venv
          /tmp/attest-venv/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          # [all] adds the optional GitHub/Qdrant extras so the SBOM can record
          # transitive pydantic; it does not change the wheel's own files.
          /tmp/attest-venv/bin/python -m pip install "${WHEEL}[all]"

      - name: Self-check the wheel against its shipped manifest
        # Genuine integrity gate: the manifest packaged in the wheel must match
        # the bytes pip just unpacked, before the regeneration step below.
        run: /tmp/attest-venv/bin/scyvera self-check

      - name: Regenerate the self manifest from the installed wheel
        run: |
          # sysconfig purelib is the venv's site-packages on every platform;
          # site.getsitepackages()[0] points at the venv root on Windows.
          SITE_PACKAGES=$(/tmp/attest-venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "SITE_PACKAGES=$SITE_PACKAGES" >> "$GITHUB_ENV"
          # The only manifest that truly matches the artifact is generated from
          # the installed wheel tree, not from the checkout, and is written back
          # into the venv's package directory for the record.
          /tmp/attest-venv/bin/python tools/generate_self_manifest.py --installed "$SITE_PACKAGES"

      - name: Self-check the regenerated manifest end to end
        run: /tmp/attest-venv/bin/scyvera self-check

      - name: Generate CycloneDX SBOM
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/attest-venv/bin/python tools/generate_sbom.py \
            --wheel "$WHEEL" \
            --output dist/scyvera.cdx.json

      - name: Build the release attestation manifest
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/attest-venv/bin/python tools/build_release_manifest.py \
            --wheel "$WHEEL" \
            --self-manifest "$SITE_PACKAGES/scyvera/_self_manifest.json" \
            --output dist/release-manifest.json

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0 (pinned 2026-11-06)
        with:
          subject-path: |
            dist/*.whl
            dist/scyvera.cdx.json
            dist/release-manifest.json

      - name: Upload wheel, SBOM, and release manifest to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          # Tag-triggered workflow_run payloads carry the tag in head_branch;
          # fall back to the tag pointing at the published commit.
          if ! git tag --points-at HEAD | grep -qx "$TAG"; then
            TAG=$(git tag --points-at HEAD | grep '^v' | head -n 1)
          fi
          if [ -z "$TAG" ]; then
            echo "error: could not resolve the release tag for this run" >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Scyvera release $TAG"
          gh release upload "$TAG" \
            dist/*.whl \
            dist/scyvera.cdx.json \
            dist/release-manifest.json \
            --clobber

  dry-run:
    name: Dry-run attestation (no Release upload)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # contents: read      -> checkout/build only; no Release upload
    # id-token: write     -> Sigstore OIDC signing
    # attestations: write -> persist the build-provenance attestation
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build PyYAML jsonschema

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install the built wheel into an isolated venv
        run: |
          python -m venv /tmp/attest-venv
          /tmp/attest-venv/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          /tmp/attest-venv/bin/python -m pip install "${WHEEL}[all]"

      - name: Self-check the wheel against its shipped manifest
        # Genuine integrity gate: the manifest packaged in the wheel must match
        # the bytes pip just unpacked, before the regeneration step below.
        run: /tmp/attest-venv/bin/scyvera self-check

      - name: Regenerate the self manifest from the installed wheel
        run: |
          # sysconfig purelib is the venv's site-packages on every platform;
          # site.getsitepackages()[0] points at the venv root on Windows.
          SITE_PACKAGES=$(/tmp/attest-venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "SITE_PACKAGES=$SITE_PACKAGES" >> "$GITHUB_ENV"
          /tmp/attest-venv/bin/python tools/generate_self_manifest.py --installed "$SITE_PACKAGES"

      - name: Self-check the regenerated manifest end to end
        run: /tmp/attest-venv/bin/scyvera self-check

      - name: Generate CycloneDX SBOM
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/attest-venv/bin/python tools/generate_sbom.py \
            --wheel "$WHEEL" \
            --output dist/scyvera.cdx.json

      - name: Build the release attestation manifest
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/attest-venv/bin/python tools/build_release_manifest.py \
            --wheel "$WHEEL" \
            --self-manifest "$SITE_PACKAGES/scyvera/_self_manifest.json" \
            --output dist/release-manifest.json

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0 (pinned 2026-11-06)
        with:
          subject-path: |
            dist/*.whl
            dist/scyvera.cdx.json
            dist/release-manifest.json

      - name: Show generated artifacts (dry run)
        run: |
          echo "Dry run complete; release upload skipped."
          ls -l dist/
          cat dist/release-manifest.json
