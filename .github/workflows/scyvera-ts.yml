name: scyvera-ts

on:
  push:
    branches:
      - main
    paths:
      - "runtimes/ts/**"
      - "vectors/**"
      - ".github/workflows/scyvera-ts.yml"
  pull_request:
    paths:
      - "runtimes/ts/**"
      - "vectors/**"
      - ".github/workflows/scyvera-ts.yml"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: runtimes/ts
    env:
      # RFC 0005 §6.2 / anchor A6: the runtime pins the suite integer here.
      PINNED_SUITE_VERSION: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: runtimes/ts/package-lock.json

      - name: Install
        run: npm ci

      - name: Check pinned suite version
        run: |
          suite="$(tr -d '\r' < ../../vectors/suite-version)"
          expected="suite-version: ${PINNED_SUITE_VERSION}"
          echo "vectors/suite-version: ${suite}"
          echo "runtime pin:            ${expected}"
          if [ "${suite}" != "${expected}" ]; then
            echo "::error::suite-version drift: this runtime pins ${PINNED_SUITE_VERSION}; update the runtime or revert the suite bump; do not run a subset"
            exit 2
          fi

      - name: Build and run package tests
        run: npm test

      - name: Run the shared conformance vectors
        run: npm run vectors
