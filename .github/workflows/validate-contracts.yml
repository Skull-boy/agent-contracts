name: Validate Agent Contracts & Package

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build Wheel & Test Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest PyYAML jsonschema PyGithub qdrant-client

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run test suite on installed package
        run: python -m pytest -v

      - name: Verify CLI executable
        run: |
          scyvera --help
          scyvera init test_contract.yaml --name "CI System" --domain "software"
          scyvera validate test_contract.yaml
          scyvera lint test_contract.yaml
