name: Validate Agent Contracts & Package

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

# Least privilege: the workflow only reads the repository. No step publishes
# anything or needs a write-scoped token.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Wheel & Test Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest PyYAML jsonschema PyGithub qdrant-client

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run test suite on installed package
        run: python -m pytest -v

      - name: Verify CLI executable
        run: |
          scyvera --help
          scyvera init test_contract.yaml --name "CI System" --domain "software"
          scyvera validate test_contract.yaml
          scyvera lint test_contract.yaml
