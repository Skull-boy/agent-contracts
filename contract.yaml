version: 1.1

system:
  name: scyvera
  purpose: >-
    Maintains the Scyvera Agent Contract specification, the Python governance
    runtime, and the scyvera-ts conformance runtime, and publishes the
    TypeScript package to the public npm registry under human approval.
  version: "1.4.0"

domain: software

lifecycle:
  mode: request-response
  initiation: human-only
  resumability: stateless

capabilities:
  - name: publish_runtime_package
    description: >-
      Publishes @scyvera/scyvera-ts to the public npm registry from a
      release-triggered workflow, after the maintainer approves the deployment
      gate.
  - name: verify_package_release
    description: >-
      Checks that the release tag matches the package version and that the
      runtime conforms to the pinned conformance suite before any artifact is
      published.

resources:
  - name: npm_registry
    type: package_registry
    access: write
    scope: "@scyvera/scyvera-ts"

permissions:
  - "registry:publish"

side_effects:
  - type: package_publish
    resource: npm_registry
    description: Publishes an immutable version of @scyvera/scyvera-ts.
    irreversible: true

approvals:
  - action: registry:publish
    required: true
    approver: repository_maintainer

dependencies:
  - name: npm_registry_api
    type: external_api
    required: true
  - name: conformance_vectors
    type: internal_artifact
    required: true

recovery:
  strategy: human_escalation
  details: >-
    A failed run stops before publication. A bad published version is deprecated
    and superseded by a fixed patch; published versions are not unpublished.

replay:
  mode: prohibited
  details: >-
    A published version is immutable, so the workflow is never replayed at the
    same version.

observability:
  level: audit
  sinks:
    - github_actions_log
    - npm_provenance

risk:
  level: low
  category: release_management
