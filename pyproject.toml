[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "agent-contract"
version = "1.1.0"
description = "Framework-independent contracts and validation tooling for AI agents and automated workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Shinjan Das" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
    "agent",
    "contracts",
    "governance",
    "validation",
    "schema",
    "specification",
    "automation",
    "workflow"
]

dependencies = [
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]

[project.scripts]
agent-contract = "agent_contracts.cli:main"

[project.urls]
Repository = "https://github.com/Skull-boy/agent-contracts"
Issues = "https://github.com/Skull-boy/agent-contracts/issues"


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
agent_contracts = [
    "schemas/*/*.json"
]